<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f6f4ed"><title>慢慢沖 · Coffee Journal</title><link rel="stylesheet" href="style.css"></head><body>
<aside><a class="brand" href="#">◒ <span>慢慢沖<small>COFFEE JOURNAL</small></span></a><nav><button class="active" data-page="home">◫　沖煮日誌</button><button data-page="recipes">♧　食譜收藏</button><button data-page="beans">◉　我的咖啡豆</button></nav><div class="aside-bottom">每一杯，都更近一點。<br><small>V60 · Hario Switch · C40</small></div></aside>
<main><header><span id="date"></span><span class="local-badge">● 個人沖煮手帳</span></header><div id="content"></div><footer>慢慢試，記低你鍾意嘅味道。<span>第一版 · 紀錄儲存在此瀏覽器</span></footer></main>
<dialog id="editor"><form id="brewform"><div class="dialog-head"><div><small>A NEW CUP</small><h2>記低呢一杯</h2></div><button type="button" class="icon" id="close">✕</button></div><label>咖啡豆<input name="bean" required placeholder="例如 Lilo · El Limoncillo"></label><div class="fields"><label>日期與時間<input name="date" type="datetime-local" required></label><label>沖煮手法<select name="method"><option>Hario Switch</option><option>V60</option><option>Timemore B75</option><option>ORIGAMI</option><option>其他</option></select></label></div><label>套用食譜<select id="preset"><option value="">自訂參數</option><option value="daily">日常 V60</option><option value="switch">Switch 全浸泡</option><option value="46">粕谷哲 4:6 · 均衡起點</option></select></label><div class="fields three"><label>咖啡粉 g<input name="dose" type="number" min="1" max="200" step="0.1" value="12" required></label><label>總注水 g<input name="water" step="0.1" type="number" min="1" max="3000" value="200" required></label><label>水溫 °C<input name="temp" step="0.1" type="number" min="1" max="100" value="86" required></label><label>C40 格數<input name="clicks" type="number" min="0" max="100" value="24" required></label><label>總時間 秒<input name="seconds" type="number" min="1" max="3600" value="180" required></label><label>粉水比<output id="ratio">1 : 16.7</output></label></div><p class="hint">C40 標準軸 clicks，自你慣用嘅零點計算。食譜格數係可調整嘅起點。</p><label>流程與人為調整<textarea name="steps" rows="3" placeholder="0:00 注水 40g，關閥；0:30 加至 200g；2:00 開閥…"></textarea></label><h3>呢杯飲落點？</h3><div id="ratings"></div><label>風味與下次想改嘅地方<textarea name="notes" rows="2" placeholder="例如：果香幾好，稍薄。下次試磨細 2 格。"></textarea></label><div class="form-bottom"><span>未評分亦可以先儲存</span><button class="primary" type="submit">儲存呢一杯 ↗</button></div></form></dialog><div id="toast" role="status"></div><script src="i18n.js"></script><script src="cloud.js"></script><script src="app.js"></script></body></html>
